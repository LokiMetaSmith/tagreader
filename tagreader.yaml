# Insert your SSID and Your PWD after inital setup
wifi:
  ap:
    ssid: ${name}

# Enable the captive portal for inital WiFi setup
captive_portal:

improv_serial:

substitutions:
  name: tagreader-wallplate
  friendly_name: TagReader

# Switch to ESP32 Platform for crypto capabilities
esp32:
  board: esp32dev

esphome:
  name: $name
  name_add_mac_suffix: true
  project:
    name: adonno.tag_reader
    version: dev

# Load custom components
external_components:
  - source:
      type: local
      path: custom_components

# SPI Configuration for PN532
spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

# DESFire PN532 Configuration
desfire_pn532:
  id: nfc_reader
  cs_pin: GPIO5
  irq_pin: GPIO4
  nasc_key: !secret nasc_aes_key # Provide 32-character hex key in secrets.yaml
  on_authenticated:
    - logger.log: "DESFire AES Auth Succeeded!"
    - if:
        condition:
          switch.is_on: buzzer_enabled
        then:
          - rtttl.play: "success:d=16,o=5,b=100:c,g,b"
    - mqtt.publish:
        topic: "tagreader/auth/success"
        payload: !lambda |-
          return "{\"user_id\":\"" + user_id + "\",\"reader_id\":\"front_door\",\"timestamp\":" + to_string(id(homeassistant_time).now().timestamp) + "}";
    - switch.turn_on: door_strike_relay
  on_auth_failed:
    - logger.log: "DESFire Auth Failed. Falling back to simple UID scan..."
    - if:
        condition:
          switch.is_on: buzzer_enabled
        then:
          - rtttl.play: "beep:d=8,o=5,b=100:b"
    - homeassistant.tag_scanned: !lambda |-
        return user_id;

# MQTT setup (required for external cluster orchestration)
mqtt:
  broker: !secret mqtt_broker_address
  # username: !secret mqtt_username
  # password: !secret mqtt_password

switch:
  - platform: gpio
    pin: GPIO12
    id: door_strike_relay
    name: "Door Strike Lock"
    on_turn_on:
      - delay: 3s
      - switch.turn_off: door_strike_relay
  - platform: template
    name: "${friendly_name} Buzzer Enabled"
    id: buzzer_enabled
    icon: mdi:volume-high
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  - platform: template
    name: "${friendly_name} LED enabled"
    id: led_enabled
    icon: mdi:alarm-light-outline
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  services:
  - service: rfidreader_tag_ok
    then:
    - rtttl.play: "beep:d=16,o=5,b=100:b"

  - service: rfidreader_tag_ko
    then:
    - rtttl.play: "beep:d=8,o=5,b=100:b"

  - service: play_rtttl
    variables:
      song_str: string
    then:
    - rtttl.play: !lambda 'return song_str;'

# Time required for timestamps in MQTT payload
time:
  - platform: homeassistant
    id: homeassistant_time

# Enable OTA upgrade
ota:
  - platform: esphome

output:
- platform: ledc
  pin: GPIO25
  id: buzzer

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"
    entity_category: diagnostic

text_sensor:
  - platform: version
    hide_timestamp: true
    name: "${friendly_name} ESPHome Version"
    entity_category: diagnostic
  - platform: wifi_info
    ip_address:
      name: "${friendly_name} IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "${friendly_name} Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic

# Define buzzer as output for RTTTL
rtttl:
  output: buzzer

# Configure LED
light:
- platform: neopixelbus
  variant: WS2812
  pin: GPIO26
  num_leds: 1
  flash_transition_length: 500ms
  type: GRB
  id: activity_led
  name: "${friendly_name} LED"
  restore_mode: ALWAYS_OFF
